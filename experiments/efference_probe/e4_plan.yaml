# E4 (README S4): SFT vs RL post-training on the same architecture.
#
# Inference only.  Every E4 collection is an *existing* wave-2 run config,
# unchanged, plus the overrides listed here -- so the diff against wave 2 is
# exactly this file.  `e4_wave.py` is the only thing that reads it.
#
#   A  sft   RLinf/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora   (SFT, card: 49.40% goal, greedy)
#   B  grpo  RLinf/RLinf-OpenVLAOFT-LIBERO-130             (GRPO from A, card: 98.09% goal)
#
# The third point of the comparison is the existing wave-2 data (`existing:`
# below); it is not re-collected.

wave: e4
unnorm_key: libero_130_no_noops_trajall

budget:
  # Hard cap on collection wall clock summed over the wave (S0+S1+S2).
  wave_gpu_hours: 12.0
  # A run at this multiple of its expected wall clock is stopped and reported.
  watchdog_factor: 2.0
  # Extra seconds the external watchdog allows past the in-process budget
  # stop before it kills a hung child (model load, a wedged env worker).
  hang_grace_s: 900

# Applied to every S1/S2 collection.  Wave 2 collected under the sampled
# evaluation protocol (main02.yaml), and GRPO (B) was trained and evaluated at
# temperature 1.6; holding decoding fixed across all three checkpoints is what
# makes the comparison about post-training rather than about decoding.  The
# Base-Lora card's 49.40% is a *greedy* number, so A's success here will not
# match it -- that is expected and reported, not corrected.
decoding_overrides:
  - model.do_sample=true
  - model.temperature=1.6

checkpoints:
  sft:
    label: Base-Lora
    hf_repo: RLinf/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora
    revision: a4ea91b3897648f3c1395e5221edb40b8f53d1a4
    # Root weights are already merged (see e4_ckpt_check.py merged-test and
    # the logbook entry of 2026-10-26): the harness loads them with
    # is_lora=false, and lora_adapter/ must NOT be applied on top.
    download_exclude: ["lora_adapter/*", "*.png", "*.svg"]
    shards:
      model-00001-of-00004.safetensors: cd7a19d50c87d262c9ff883281f82f39b3900e718fa17b53f0a8b84637c5ab48
      model-00002-of-00004.safetensors: bb912de0e25f879d89702f9b00d403bd3c3f13e1b8395e696ca3e4f82ffba03f
      model-00003-of-00004.safetensors: 02dadec56f8279273ab6ec163cf443f631385b19300b75e3247861a91e6c1997
      model-00004-of-00004.safetensors: 7addc803639435c6bee725cc0cc9af97745b3d4da6f8ce18b0d43efd0beb96a3
  grpo:
    label: GRPO
    hf_repo: RLinf/RLinf-OpenVLAOFT-LIBERO-130
    revision: 473954241c8148bc9a1bf9ed547a74523e4a7d41
    # Carries a 5-tensor value_head; the harness sets add_value_head=false, so
    # those weights are dropped at load and never touch the action path.
    download_exclude: ["*.png", "*.svg"]
    shards:
      model-00001-of-00004.safetensors: 6403b3de54dd815fd33ab46a082dd34a496e78d72876cf1a063b2cdbdcd03c81
      model-00002-of-00004.safetensors: 45893a45677216bf9481f38c4aa51b5679142a6fe484cc6552bc58ec2b9490df
      model-00003-of-00004.safetensors: 8c91fe55cb1a33a31fb0dad4c17acdcba7e219e75df78a0c5820063a193bea51
      model-00004-of-00004.safetensors: f60c3c43d82fda8d0afaf20fa011e6265e5649b13071793943527c05bdecc2da

# expected_s: measured wave-2 wall clock of the same config, startup included
# (logbook START -> DONE), at num_envs=10 on the wave-2 card.  Scaled by the
# speed factor locked before S1; the watchdog fires at watchdog_factor x that.
stages:
  s0:
    - {key: smoke, config: smoke.yaml, expected_s: 683, decoding: false}
  # Optional memory probe for num_envs=20; only consulted by `lock --num-envs 20`.
  s0_envs20:
    - key: smoke20
      config: smoke.yaml
      expected_s: 900
      decoding: false
      overrides: [env.num_envs=20, env.init_states_per_task=20]
  s1:
    # pilot.yaml predates wave 1's switch to sampled decoding; the pilot must
    # run the protocol S2 will run, so decoding_overrides apply here too.
    - {key: pilot, config: pilot.yaml, expected_s: 600}
  # Listed in run order: the primary contrast (goal swap, both checkpoints)
  # first, so a budget stop cuts from the tail.
  s2:
    - {key: goal_swap_s1, suite: goal, transform: swap, seed: 1, config: main02.yaml, expected_s: 1408}
    - {key: goal_swap_s2, suite: goal, transform: swap, seed: 2, config: main02.yaml, expected_s: 1408}
    - {key: goal_mirror_s1, suite: goal, transform: mirror, seed: 1, config: main02_mirror.yaml, expected_s: 1503}
    - {key: goal_freeze_s1, suite: goal, transform: freeze, seed: 1, config: main02_freeze.yaml, expected_s: 1518}
    - {key: goal_mirror_s2, suite: goal, transform: mirror, seed: 2, config: main02_mirror.yaml, expected_s: 1503}
    - {key: goal_freeze_s2, suite: goal, transform: freeze, seed: 2, config: main02_freeze.yaml, expected_s: 1518}
    - {key: spatial_swap_s0, suite: spatial, transform: swap, seed: 0, config: suite_spatial.yaml, expected_s: 1988}
    - {key: object_swap_s0, suite: object, transform: swap, seed: 0, config: suite_object.yaml, expected_s: 1506}
    # suite_long.yaml collects 15 states x 10 tasks = 150 episodes, not 200;
    # kept unchanged so it stays comparable with suite_long01.
    - {key: long_swap_s0, suite: long, transform: swap, seed: 0, config: suite_long.yaml, expected_s: 1848}

# Probe rounds.  expected_s from the wave-2 CPU-pod ledger at 16 CPUs.
probes:
  linear:
    args: [--stage, main, --permutations, "200"]
    expected_s: 800
  mlp:
    args: [--stage, main, --probe-family, mlp]
    expected_s: 8400
    suites: [goal]
  pilot:
    args: [--stage, pilot]
    expected_s: 300

# Existing wave-2 runs: the third point of every table.  Not re-collected.
# For non-goal suites the existing point is that suite's own SFT checkpoint
# (Haozhan72/Openvla-oft-SFT-libero-<suite>-traj1), not goal-traj1.
existing:
  label_goal: goal-traj1
  runs:
    - {run_id: main02, suite: goal, transform: swap, seed: 1, label: goal-traj1}
    - {run_id: main02_mirror, suite: goal, transform: mirror, seed: 1, label: goal-traj1}
    - {run_id: main02_freeze, suite: goal, transform: freeze, seed: 1, label: goal-traj1}
    - {run_id: suite_spatial02, suite: spatial, transform: swap, seed: 0, label: spatial-traj1}
    - {run_id: suite_object01, suite: object, transform: swap, seed: 0, label: object-traj1}
    - {run_id: suite_long01, suite: long, transform: swap, seed: 0, label: libero10-traj1}
