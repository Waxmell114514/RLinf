# Wave 3, E2 (line A): the SFT side of the RL control, on exactly the episode
# set e2_rl.yaml uses (same seed, same 10 x 50 initial states, same batch
# layout).  main02 is an SFT replicate too, but on 20 states per task; this run
# makes the SFT-vs-RL contrast a matched pair -- same initial states, same
# schedule RNG, comparable sample size, so the two selection floors are
# directly comparable (PREREG_wave3.md, E2).
run_id: e2_sft
out_root: experiments/efference_probe/data
notes: "Wave 3 E2: SFT traj1 on the exact E2 episode set, swap, 10 tasks x 50 states, seed 1"

model:
  model_path: /path/to/model/Openvla-oft-SFT-libero-goal-traj1/
  unnorm_key: libero_goal_no_noops
  max_prompt_length: 128
  do_sample: true
  temperature: 1.6

env:
  task_suite_name: libero_goal
  task_ids: null
  init_states_per_task: 50
  num_envs: 20
  max_calls_per_episode: 40
  seed: 1

hijack:
  enabled: true
  transform: swap
  p_hijack: 0.25
  warmup_calls: 4
  min_clean_gap: 2
  probe_episode_fraction: 0.8

capture:
  layers: [0, 4, 8, 12, 16, 20, 24, 28, 32]
  pools: [ctx_mean, ctx_last, act_mean]
  capture_vision: false
  verify_indexing: true

frames:
  mode: episodes
  max_episodes: 5

budget:
  max_gpu_hours: 4.0
  max_disk_gb: 30.0
