# Wave 3, E2 (line A): mirror arm of the RL control.  Same pre-registered task
# set {2,3,6,8,9} as main02_mirror (the top-5 relative-action-change rule in the
# logbook), so the SFT and GRPO arms perturb the same tasks.  50 states per
# task for the reason given in e2_rl.yaml.
run_id: e2_rl_mirror
out_root: experiments/efference_probe/data
notes: "Wave 3 E2: GRPO mirror arm, tasks {2,3,6,8,9} x 50 states, seed 1"

model:
  model_path: /path/to/model/RLinf-OpenVLAOFT-GRPO-LIBERO-goal/
  unnorm_key: libero_goal_no_noops
  max_prompt_length: 128
  do_sample: true
  temperature: 1.6

env:
  task_suite_name: libero_goal
  task_ids: [2, 3, 6, 8, 9]
  init_states_per_task: 50
  num_envs: 20
  max_calls_per_episode: 40
  seed: 1

hijack:
  enabled: true
  transform: mirror
  p_hijack: 0.25
  warmup_calls: 4
  min_clean_gap: 2
  probe_episode_fraction: 0.8

capture:
  layers: [0, 4, 8, 12, 16, 20, 24, 28, 32]
  pools: [ctx_mean, ctx_last, act_mean]
  capture_vision: false
  verify_indexing: true

frames:
  mode: episodes
  max_episodes: 5

budget:
  max_gpu_hours: 4.0
  max_disk_gb: 30.0
